name: Release

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm dist-tag (auto-detected from version if empty)
        required: false
        default: ''
      verify-only:
        description: 只验证 npm token secret 命中情况（whoami 仅参考），不发布
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

# 发布顺序护栏（naming-cutover 4.1）：@morphixai/mxenv-core 必须最先发布，其余三包的
# prepublishOnly（scripts/prepublish-guard.mjs）会在 registry 解析不到依赖时
# 拒绝发布。CI 缺 npm token（NPM_TOKEN / NPM_AUTOMATION_TOKEN）时显式失败——勿假绿。
jobs:
  # 快速凭证校验（verify-only 时只跑这一个 job）：报 secret 命中名/占位符/长度，不打印任何值。
  # 注意：actions/setup-node 在 NODE_AUTH_TOKEN 为空时会注入字面占位符 'XXXXX-XXXXX-XXXXX-XXXXX'
  # （authutil.ts exportVariable），占位符一律视为无 token 显式红——勿假绿。
  # secret 取用顺序：NPM_TOKEN → NPM_AUTOMATION_TOKEN。
  verify-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_AUTOMATION_TOKEN }}
      RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      RAW_NPM_AUTOMATION_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Verify npm token present
        run: |
          # 只报 secret 名命中/占位符/长度，不打印任何值
          report() {
            local name="$1" val="$2"
            if [ -z "$val" ]; then
              echo "$name: unset"
            elif [ "$val" = "XXXXX-XXXXX-XXXXX-XXXXX" ]; then
              echo "$name: set but LITERAL PLACEHOLDER value (len ${#val}) —— 配置的是占位符，需换成真实 npm token"
            else
              echo "$name: set (len ${#val})"
            fi
          }
          report NPM_TOKEN "$RAW_NPM_TOKEN"
          report NPM_AUTOMATION_TOKEN "$RAW_NPM_AUTOMATION_TOKEN"
          # 真相源是 secrets 上下文（RAW_*）。NODE_AUTH_TOKEN 可能被 actions/setup-node
          # 注入字面占位符（authutil.ts: NODE_AUTH_TOKEN || 'XXXXX-XXXXX-XXXXX-XXXXX'），
          # 不能据此判定 token 存在。
          if [ -z "$RAW_NPM_TOKEN" ] && [ -z "$RAW_NPM_AUTOMATION_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN 与 secrets.NPM_AUTOMATION_TOKEN 均缺失——无法发布，显式失败（在仓库/组织 secret 配置其一；本仓 CI 未配置时请走本地发布：pnpm -r build && 按序 npm publish）" >&2
            exit 1
          fi
          if [ "$NODE_AUTH_TOKEN" = "XXXXX-XXXXX-XXXXX-XXXXX" ]; then
            echo "::error::NODE_AUTH_TOKEN 是 setup-node 注入的字面占位符——secret 名字有误或仓库不可见，请核对 NPM_TOKEN / NPM_AUTOMATION_TOKEN 配置" >&2
            exit 1
          fi
          # whoami 仅作参考：granular access token 对 /-/whoami 可能 401（npm CLI 已知情况），
          # 不作为发布门槛——最终以 npm publish 结果为准。
          if npm whoami >/dev/null 2>&1; then
            echo "npm whoami OK ($(npm whoami))"
          else
            echo "::warning::npm whoami 未能认证（granular token 不支持 whoami 属已知情况，或 token 无效）；发布可用性以 publish 步骤为准"
          fi

  publish:
    needs: verify-token
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Resolve version + dist-tag
        id: tag
        run: |
          VERSION=$(node -p "require('./packages/mxenv-core/package.json').version")
          # 版本源=workspace 包版本，四份 manifest 必须一致（lockstep）。
          node -e '
            const fs = require("fs")
            const files = ["./package.json", "./packages/mxenv-core/package.json", "./packages/mxenv/package.json", "./packages/mxenv-cli/package.json"]
            const version = process.argv[1]
            for (const f of files) {
              const v = JSON.parse(fs.readFileSync(f, "utf8")).version
              if (v !== version) {
                console.error(`::error::${f} version ${v} != ${version}（lockstep 破裂）`)
                process.exit(1)
              }
            }
          ' "$VERSION"
          if [ -n "${{ github.event.inputs.npm-tag }}" ]; then
            TAG="${{ github.event.inputs.npm-tag }}"
          elif [[ "$VERSION" == *-* ]]; then
            TAG=beta
          else
            TAG=latest
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "v${{ steps.tag.outputs.version }}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace version v${{ steps.tag.outputs.version }}" >&2
            exit 1
          fi
      - name: Full test gate
        run: pnpm -r test && pnpm test
      # 发布顺序：@morphixai/mxenv-core → @morphixai/mxenv → @morphixai/mxenv-cli
      # → morphix-env（收尾转发）。各包 prepublishOnly（guard + 根包测试）在
      # npm publish 内自动执行。
      #
      # 发布链容错（0.14.0 事故 followup，run 42551081396）：npm publish 对已发布
      # 版本会 EPUBLISHCONFLICT 且不可重发，半途失败后重跑整个链曾无法续跑。
      # 现每个包：预检 registry 已有该版本即跳过；publish 失败后复查 registry，
      # 已上线（预检漏判/CDN 延迟）视为成功继续——链路可整体重跑恢复。
      - name: Publish packages (core-first, 已发布跳过可续跑)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          publish_one() {
            local dir="$1" name="$2"
            if npm view "$name@$VERSION" version --prefer-online >/dev/null 2>&1; then
              echo "::notice::$name@$VERSION 已在 registry，跳过发布（链路续跑）"
              return 0
            fi
            if (cd "$dir" && npm publish --access public --tag "$TAG"); then
              return 0
            fi
            if npm view "$name@$VERSION" version --prefer-online >/dev/null 2>&1; then
              echo "::notice::$name@$VERSION 已在 registry（预检漏判），继续"
              return 0
            fi
            echo "::error::$name@$VERSION 发布失败且 registry 无此版本——查上方 prepublish-guard 输出；修复后重跑本 workflow 即可续跑（已发布包自动跳过）"
            return 1
          }
          publish_one packages/mxenv-core @morphixai/mxenv-core
          publish_one packages/mxenv @morphixai/mxenv
          publish_one packages/mxenv-cli @morphixai/mxenv-cli
          publish_one . morphix-env
      # 只在发布成功后建 GitHub Release（Release 存在 ⇒ 对应 npm 版本已上线）；
      # Release 已存在时跳过（链路续跑/手动兜底后重跑的去重）。
      - name: Create GitHub Release (含迁移表)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.tag.outputs.version }}" >/dev/null 2>&1; then
            echo "::notice::GitHub Release v${{ steps.tag.outputs.version }} 已存在，跳过"
            exit 0
          fi
          node -e '
            const fs = require("fs")
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8")
            const version = process.argv[1]
            const section = changelog.split(/^## /m).find((s) => s.startsWith(version))
            if (!section) { console.error(`::error::CHANGELOG 缺 ${version} 段`); process.exit(1) }
            fs.writeFileSync("/tmp/release-notes.md", section.trim() + "\n")
          ' "${{ steps.tag.outputs.version }}"
          gh release create "v${{ steps.tag.outputs.version }}" \
            --title "mxenv v${{ steps.tag.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --prerelease="$([ "${{ steps.tag.outputs.tag }}" != "latest" ] && echo true || echo false)"
