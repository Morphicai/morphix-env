name: Release

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm dist-tag (auto-detected from version if empty)
        required: false
        default: ''
      verify-only:
        description: 只验证 npm token 是否可用（whoami），不发布
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

# 发布顺序护栏（naming-cutover 4.1）：@morphixai/mxenv-core 必须最先发布，其余三包的
# prepublishOnly（scripts/prepublish-guard.mjs）会在 registry 解析不到依赖时
# 拒绝发布。CI 缺 npm token（NPM_TOKEN / NPM_AUTOMATION_TOKEN）时显式失败——勿假绿。
jobs:
  # 快速凭证校验（verify-only 时只跑这一个 job）：token 存在且能通过 registry 认证
  # （npm whoami），失败即显式红——勿假绿。secret 取用顺序：NPM_TOKEN → NPM_AUTOMATION_TOKEN。
  verify-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_AUTOMATION_TOKEN }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      HAS_NPM_AUTOMATION_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN != '' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Verify npm token present + authenticated
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN 与 secrets.NPM_AUTOMATION_TOKEN 均缺失——无法发布，显式失败（在仓库/组织 secret 配置其一；本仓 CI 未配置时请走本地发布：pnpm -r build && 按序 npm publish）" >&2
            exit 1
          fi
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::npm token 存在但 registry 认证失败（npm whoami 401）——token 过期或无效" >&2
            exit 1
          fi
          # 只报 secret 名字是否命中，不打印任何值
          echo "token source: NPM_TOKEN=$HAS_NPM_TOKEN, NPM_AUTOMATION_TOKEN=$HAS_NPM_AUTOMATION_TOKEN"
          echo "npm token OK (whoami: $(npm whoami))"

  publish:
    needs: verify-token
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Resolve version + dist-tag
        id: tag
        run: |
          VERSION=$(node -p "require('./packages/mxenv-core/package.json').version")
          # 版本源=workspace 包版本，四份 manifest 必须一致（lockstep）。
          node -e '
            const fs = require("fs")
            const files = ["./package.json", "./packages/mxenv-core/package.json", "./packages/mxenv/package.json", "./packages/mxenv-cli/package.json"]
            const version = process.argv[1]
            for (const f of files) {
              const v = JSON.parse(fs.readFileSync(f, "utf8")).version
              if (v !== version) {
                console.error(`::error::${f} version ${v} != ${version}（lockstep 破裂）`)
                process.exit(1)
              }
            }
          ' "$VERSION"
          if [ -n "${{ github.event.inputs.npm-tag }}" ]; then
            TAG="${{ github.event.inputs.npm-tag }}"
          elif [[ "$VERSION" == *-* ]]; then
            TAG=beta
          else
            TAG=latest
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "v${{ steps.tag.outputs.version }}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace version v${{ steps.tag.outputs.version }}" >&2
            exit 1
          fi
      - name: Full test gate
        run: pnpm -r test && pnpm test
      # 发布顺序：@morphixai/mxenv-core → @morphixai/mxenv → @morphixai/mxenv-cli
      # → morphix-env（收尾转发）。各包 prepublishOnly（guard + 根包测试）在
      # npm publish 内自动执行。
      - name: Publish @morphixai/mxenv-core (core-first)
        working-directory: packages/mxenv-core
        run: npm publish --access public --tag "${{ steps.tag.outputs.tag }}"
      - name: Publish @morphixai/mxenv
        working-directory: packages/mxenv
        run: npm publish --access public --tag "${{ steps.tag.outputs.tag }}"
      - name: Publish @morphixai/mxenv-cli
        working-directory: packages/mxenv-cli
        run: npm publish --access public --tag "${{ steps.tag.outputs.tag }}"
      - name: Publish morphix-env (deprecated forwarding shim)
        run: npm publish --access public --tag "${{ steps.tag.outputs.tag }}"
      # 只在发布成功后建 GitHub Release（Release 存在 ⇒ 对应 npm 版本已上线）。
      - name: Create GitHub Release (含迁移表)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs")
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8")
            const version = process.argv[1]
            const section = changelog.split(/^## /m).find((s) => s.startsWith(version))
            if (!section) { console.error(`::error::CHANGELOG 缺 ${version} 段`); process.exit(1) }
            fs.writeFileSync("/tmp/release-notes.md", section.trim() + "\n")
          ' "${{ steps.tag.outputs.version }}"
          gh release create "v${{ steps.tag.outputs.version }}" \
            --title "mxenv v${{ steps.tag.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --prerelease="$([ "${{ steps.tag.outputs.tag }}" != "latest" ] && echo true || echo false)"
