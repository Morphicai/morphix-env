<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">mxenv logo concepts</title>
  <desc id="desc">Four logo directions for mxenv, each shown as a large icon, horizontal wordmark, and 64, 32, and 16 pixel previews.</desc>
  <defs>
    <style>
      :root {
    --bg: #F4F6FA;
    --surface: #FFFFFF;
    --text: #111827;
    --text-muted: #5B6472;
    --line: #D7DDE8;
    --brand: #3157D5;
    --brand-static: #3157D5;
    --tile-dark: #111827;
    --glyph: #FFFFFF;
    --source: #C9D6FF;
    --mint: #79E2C3;
    --cut: #173F38;
}
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font-size:15px;font-weight:700;letter-spacing:2px}.card-title{font-size:30px;font-weight:720}.body{font-size:20px}.note{font-size:16px;fill:var(--text-muted)}.word{font-size:54px;font-weight:760;letter-spacing:-2px;fill:var(--text)}
    </style>
    <symbol id="a" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="17" fill="var(--brand-static)"/>
      <g fill="none" stroke="var(--glyph)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18h7c8 0 8 14 15 14"/><path d="M15 32h22"/><path d="M15 46h7c8 0 8-14 15-14"/><path d="M42 32h9m-5-5 5 5-5 5"/></g>
      <g fill="var(--source)"><circle cx="12" cy="18" r="3.5"/><circle cx="12" cy="32" r="3.5"/><circle cx="12" cy="46" r="3.5"/></g><circle cx="38" cy="32" r="6.5" fill="var(--mint)"/>
    </symbol>
    <symbol id="b" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="17" fill="var(--tile-dark)"/>
      <path d="M12 45V19l12 16 12-16v26" fill="none" stroke="var(--glyph)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 22l11 22m0-22L42 44" fill="none" stroke="var(--mint)" stroke-width="6" stroke-linecap="round"/>
    </symbol>
    <symbol id="c" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="17" fill="var(--brand-static)"/>
      <g fill="none" stroke="var(--glyph)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 15h-3c-5 0-7 3-7 7v4c0 4-2 6-5 6 3 0 5 2 5 6v4c0 4 2 7 7 7h3"/><path d="M42 15h3c5 0 7 3 7 7v4c0 4 2 6 5 6-3 0-5 2-5 6v4c0 4-2 7-7 7h-3"/></g>
      <circle cx="32" cy="28" r="7" fill="var(--mint)"/><path d="M28.5 32h7l-2 12h-3Z" fill="var(--mint)"/><circle cx="32" cy="28" r="2.3" fill="var(--cut)"/><path d="m31 30-1.5 9h5L33 30Z" fill="var(--cut)"/>
    </symbol>
    <symbol id="d" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="17" fill="var(--tile-dark)"/>
      <g fill="var(--glyph)"><rect x="11" y="14" width="29" height="9" rx="4.5"/><rect x="11" y="27.5" width="24" height="9" rx="4.5"/><rect x="11" y="41" width="29" height="9" rx="4.5"/></g>
      <path d="M40 27.5h7v9h-7Zm0-14 12 7-12 7Zm0 30 12-7-12-7Z" fill="var(--mint)"/>
    </symbol>
  </defs>
  <rect width="1600" height="1120" fill="var(--bg)"/>
  <text x="64" y="68" class="label" fill="var(--brand)">MXENV / IDENTITY EXPLORATION</text>
  <text x="64" y="132" fill="var(--text)" font-size="52" font-weight="760" letter-spacing="-1.5">One composition layer. Four marks.</text>
  <text x="64" y="174" class="body" fill="var(--text-muted)">Flat geometry · no gradients · no external assets · tested at 64 / 32 / 16 px</text>

  <g transform="translate(64 220)">
    <rect width="704" height="390" rx="24" fill="var(--surface)" stroke="var(--line)"/>
    <text x="36" y="48" class="label" fill="var(--brand)">A / CONVERGE</text>
    <use href="#a" x="36" y="78" width="128" height="128"/>
    <text x="192" y="162" class="word">mxenv</text>
    <text x="36" y="252" class="card-title" fill="var(--text)">Many sources. One controlled path.</text>
    <text x="36" y="286" class="body" fill="var(--text-muted)">The most direct expression of composition.</text>
    <use href="#a" x="36" y="316" width="48" height="48"/><use href="#a" x="112" y="324" width="32" height="32"/><use href="#a" x="172" y="332" width="16" height="16"/>
    <text x="214" y="347" class="note">Bold rails survive small sizes.</text>
  </g>

  <g transform="translate(832 220)">
    <rect width="704" height="390" rx="24" fill="var(--surface)" stroke="var(--line)"/>
    <text x="36" y="48" class="label" fill="var(--brand)">B / MX RELAY</text>
    <use href="#b" x="36" y="78" width="128" height="128"/>
    <text x="192" y="162" class="word">mxenv</text>
    <text x="36" y="252" class="card-title" fill="var(--text)">A compact name-led monogram.</text>
    <text x="36" y="286" class="body" fill="var(--text-muted)">Strong recognition; less explanation of the product.</text>
    <use href="#b" x="36" y="316" width="48" height="48"/><use href="#b" x="112" y="324" width="32" height="32"/><use href="#b" x="172" y="332" width="16" height="16"/>
    <text x="214" y="347" class="note">Simplest geometry of the four.</text>
  </g>

  <g transform="translate(64 654)">
    <rect width="704" height="390" rx="24" fill="var(--surface)" stroke="var(--line)"/>
    <text x="36" y="48" class="label" fill="var(--brand)">C / ENV GATE</text>
    <use href="#c" x="36" y="78" width="128" height="128"/>
    <text x="192" y="162" class="word">mxenv</text>
    <text x="36" y="252" class="card-title" fill="var(--text)">Environment, with a guarded core.</text>
    <text x="36" y="286" class="body" fill="var(--text-muted)">Terminal context is clear; composition is implicit.</text>
    <use href="#c" x="36" y="316" width="48" height="48"/><use href="#c" x="112" y="324" width="32" height="32"/><use href="#c" x="172" y="332" width="16" height="16"/>
    <text x="214" y="347" class="note">Keyhole detail drops out first.</text>
  </g>

  <g transform="translate(832 654)">
    <rect width="704" height="390" rx="24" fill="var(--surface)" stroke="var(--line)"/>
    <text x="36" y="48" class="label" fill="var(--brand)">D / PROFILE STACK</text>
    <use href="#d" x="36" y="78" width="128" height="128"/>
    <text x="192" y="162" class="word">mxenv</text>
    <text x="36" y="252" class="card-title" fill="var(--text)">Profiles resolve into one run.</text>
    <text x="36" y="286" class="body" fill="var(--text-muted)">Architectural abstraction; weakest secret signal.</text>
    <use href="#d" x="36" y="316" width="48" height="48"/><use href="#d" x="112" y="324" width="32" height="32"/><use href="#d" x="172" y="332" width="16" height="16"/>
    <text x="214" y="347" class="note">Reads as layers, not a vault.</text>
  </g>
</svg>
