<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-labelledby="title desc">
  <title id="title">mxenv secret flow</title>
  <desc id="desc">Not another secret manager: Infisical, Doppler, dotenvx, macOS Keychain and local files keep owning values. mxenv composes a profile on your machine, and agents, processes and code consume through controlled paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3157D5"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .ink{fill:#111827}.muted{fill:#5B6472}.faint{fill:#7B8494}.label{font-size:15px;font-weight:700;letter-spacing:2px}.body{font-size:19px}.small{font-size:16px}.cardtitle{font-size:23px;font-weight:600}
    </style>
  </defs>
  <rect width="1600" height="720" fill="#F7F9FC"/>
  <g class="sans">
    <text x="64" y="66" class="label" fill="#3157D5">THE SECRET FLOW</text>
    <text x="64" y="130" class="ink" font-size="52" font-weight="700" letter-spacing="-1.8">Your secret managers, composed.</text>

    <rect x="64" y="196" width="320" height="490" rx="22" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.25"/>
    <text x="96" y="240" class="label faint">VALUE OWNERS</text>
    <text x="96" y="276" class="ink cardtitle">Your existing sources</text>

    <g class="body ink">
      <circle cx="112" cy="330" r="15" fill="#E8EDFF"/><text x="112" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#3157D5">I</text><text x="142" y="336">Infisical</text>
      <circle cx="112" cy="386" r="15" fill="#E8EDFF"/><text x="112" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#3157D5">D</text><text x="142" y="392">Doppler</text>
      <circle cx="112" cy="442" r="15" fill="#E8EDFF"/><text x="112" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#3157D5">dx</text><text x="142" y="448">dotenvx</text>
      <circle cx="112" cy="498" r="15" fill="#E8EDFF"/><circle cx="112" cy="494" r="4.5" fill="none" stroke="#3157D5" stroke-width="2"/><path d="M109 497l-3 9h12l-3-9" fill="none" stroke="#3157D5" stroke-width="2"/><text x="142" y="504">macOS Keychain</text>
      <circle cx="112" cy="554" r="15" fill="#E8EDFF"/><path d="M106 547h9l4 4v13h-13Zm9 0v5h4" fill="none" stroke="#3157D5" stroke-width="1.75" stroke-linejoin="round"/><text x="142" y="560">Local .env <tspan class="small faint">dev only</tspan></text>
      <circle cx="112" cy="610" r="15" fill="#E8EDFF"/><path d="M105 610h14M112 603v14" stroke="#3157D5" stroke-width="2" stroke-linecap="round"/><text x="142" y="616">Custom providers</text>
    </g>

    <path d="M386 430h96" stroke="#3157D5" stroke-width="2.25" marker-end="url(#arrow)"/>
    <text x="434" y="390" text-anchor="middle" class="small" fill="#3157D5">selected</text>
    <text x="434" y="411" text-anchor="middle" class="small" fill="#3157D5">sources</text>

    <rect x="500" y="176" width="600" height="510" rx="26" fill="#FFFFFF" stroke="#AEBBD9" stroke-width="1.5"/>
    <g transform="translate(540 206)">
      <rect x="2" y="2" width="60" height="60" rx="17" fill="#111827"/>
      <path fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" d="M19.5 41.5V30c0-3.45 2.8-6.25 6.25-6.25s6.25 2.8 6.25 6.25v11.5m0-11.5c0-3.45 2.8-6.25 6.25-6.25s6.25 2.8 6.25 6.25V41.5"/>
      <circle cx="47" cy="17" r="4" fill="#79E2C3"/>
    </g>
    <text x="622" y="248" class="ink" font-size="36" font-weight="700" letter-spacing="-1">mxenv</text>
    <rect x="872" y="212" width="192" height="36" rx="18" fill="#E5F8F1"/><circle cx="896" cy="230" r="4.5" fill="#198865"/><text x="910" y="236" font-size="15" font-weight="600" fill="#176B52">ON YOUR MACHINE</text>

    <rect x="540" y="292" width="520" height="88" rx="14" fill="#F5F7FB" stroke="#DDE3ED" stroke-width="1.25"/>
    <text x="568" y="326" class="mono" font-size="16" fill="#3157D5">01 / SELECT</text>
    <text x="568" y="356" class="ink cardtitle">A profile declares the wiring</text>

    <rect x="540" y="396" width="520" height="88" rx="14" fill="#F5F7FB" stroke="#DDE3ED" stroke-width="1.25"/>
    <text x="568" y="430" class="mono" font-size="16" fill="#3157D5">02 / COMPOSE</text>
    <text x="568" y="460" class="ink cardtitle">Merge once for this run</text>

    <rect x="540" y="500" width="520" height="88" rx="14" fill="#EDF9F5" stroke="#B9E5D7" stroke-width="1.25"/>
    <text x="568" y="534" class="mono" font-size="16" fill="#198865">03 / PROTECT</text>
    <text x="568" y="564" class="ink cardtitle">Redact output. Audit names.</text>

    <path d="M1102 356h96" stroke="#3157D5" stroke-width="2.25" marker-end="url(#arrow)"/>
    <text x="1150" y="322" text-anchor="middle" class="small" fill="#3157D5">run</text>
    <text x="1150" y="343" text-anchor="middle" class="small" fill="#3157D5">fetch</text>

    <rect x="1216" y="196" width="320" height="490" rx="22" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.25"/>
    <text x="1248" y="240" class="label faint">CONSUMERS</text>
    <text x="1248" y="276" class="ink cardtitle">Agents, processes, code</text>

    <rect x="1240" y="302" width="272" height="106" rx="14" fill="#EEF2FF"/>
    <path d="M1264 328h26a5 5 0 0 1 5 5v20a5 5 0 0 1-5 5h-26a5 5 0 0 1-5-5v-20a5 5 0 0 1 5-5Z" fill="none" stroke="#3157D5" stroke-width="2"/><path d="m1267 339 5 4-5 4m9 0h8" fill="none" stroke="#3157D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1310" y="346" class="ink" font-size="21" font-weight="600">Agent</text>
    <text x="1264" y="384" class="mono" font-size="15" fill="#3157D5">mxenv run --serve</text>

    <rect x="1240" y="428" width="272" height="106" rx="14" fill="#F5F7FB"/>
    <rect x="1264" y="452" width="31" height="26" rx="5" fill="none" stroke="#3157D5" stroke-width="2"/><path d="M1264 460h31" stroke="#3157D5" stroke-width="2"/>
    <text x="1310" y="472" class="ink" font-size="21" font-weight="600">Process</text>
    <text x="1264" y="510" class="mono" font-size="15" fill="#3157D5">mxenv run</text>

    <rect x="1240" y="554" width="272" height="106" rx="14" fill="#F5F7FB"/>
    <path d="M1272 596l-7 7 7 7M1286 596l7 7-7 7M1283 594l-5 18" fill="none" stroke="#3157D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1310" y="598" class="ink" font-size="21" font-weight="600">Code</text>
    <text x="1264" y="636" class="mono" font-size="15" fill="#3157D5">inspect · skill · audit</text>
  </g>
</svg>
