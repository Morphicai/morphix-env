<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="title desc">
  <title id="title">mxenv secret flow</title>
  <desc id="desc">Providers keep owning values. mxenv composes a profile on your machine; processes and agent runtimes consume through controlled paths, model context receives names only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3157D5"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8A94A6"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .ink{fill:#111827}.muted{fill:#5B6472}.faint{fill:#7B8494}.label{font-size:15px;font-weight:700;letter-spacing:2px}.body{font-size:19px}.small{font-size:16px}.cardtitle{font-size:23px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="700" fill="#F7F9FC"/>
  <g class="sans">
    <text x="64" y="66" class="label" fill="#3157D5">THE SECRET FLOW</text>
    <text x="64" y="130" class="ink" font-size="52" font-weight="700" letter-spacing="-1.8">Your providers. One composed environment.</text>

    <rect x="64" y="196" width="320" height="470" rx="22" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.25"/>
    <text x="96" y="240" class="label faint">VALUE OWNERS</text>
    <text x="96" y="276" class="ink cardtitle">Your existing sources</text>

    <g class="body ink">
      <circle cx="112" cy="330" r="15" fill="#E8EDFF"/><path d="M105 330h14M112 323v14" stroke="#3157D5" stroke-width="2" stroke-linecap="round"/><text x="142" y="336">Infisical</text>
      <circle cx="112" cy="386" r="15" fill="#E8EDFF"/><path d="M105 391l7-11 7 11Z" fill="none" stroke="#3157D5" stroke-width="2" stroke-linejoin="round"/><text x="142" y="392">Doppler</text>
      <circle cx="112" cy="442" r="15" fill="#E8EDFF"/><path d="M106 436l12 12m0-12-12 12" stroke="#3157D5" stroke-width="2" stroke-linecap="round"/><text x="142" y="448">dotenvx</text>
      <circle cx="112" cy="498" r="15" fill="#E8EDFF"/><circle cx="112" cy="494" r="4.5" fill="none" stroke="#3157D5" stroke-width="2"/><path d="M109 497l-3 9h12l-3-9" fill="none" stroke="#3157D5" stroke-width="2"/><text x="142" y="504">macOS Keychain</text>
      <circle cx="112" cy="554" r="15" fill="#E8EDFF"/><path d="M106 547h9l4 4v13h-13Zm9 0v5h4" fill="none" stroke="#3157D5" stroke-width="1.75" stroke-linejoin="round"/><text x="142" y="560">Local .env <tspan class="small faint">dev only</tspan></text>
      <circle cx="112" cy="610" r="15" fill="#E8EDFF"/><path d="M105 610h14M112 603v14" stroke="#3157D5" stroke-width="2" stroke-linecap="round"/><text x="142" y="616">Custom providers</text>
    </g>

    <path d="M384 430h72" stroke="#3157D5" stroke-width="2.25" marker-end="url(#arrow)"/>
    <text x="424" y="392" text-anchor="middle" class="small" fill="#3157D5">selected</text>
    <text x="424" y="413" text-anchor="middle" class="small" fill="#3157D5">sources</text>

    <rect x="480" y="176" width="640" height="510" rx="26" fill="#FFFFFF" stroke="#AEBBD9" stroke-width="1.5"/>
    <g transform="translate(520 210) scale(.62)">
      <rect x="2" y="2" width="60" height="60" rx="17" fill="#111827"/>
      <path fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" d="M19.5 41.5V30c0-3.45 2.8-6.25 6.25-6.25s6.25 2.8 6.25 6.25v11.5m0-11.5c0-3.45 2.8-6.25 6.25-6.25s6.25 2.8 6.25 6.25V41.5"/>
      <circle cx="47" cy="17" r="4" fill="#79E2C3"/>
    </g>
    <text x="572" y="236" class="ink" font-size="31" font-weight="700">mxenv</text>
    <rect x="912" y="204" width="168" height="34" rx="17" fill="#E5F8F1"/><circle cx="936" cy="221" r="4.5" fill="#198865"/><text x="950" y="227" font-size="15" font-weight="600" fill="#176B52">ON YOUR MACHINE</text>

    <rect x="520" y="288" width="560" height="88" rx="14" fill="#F5F7FB" stroke="#DDE3ED" stroke-width="1.25"/>
    <text x="548" y="322" class="mono" font-size="16" fill="#3157D5">01 / SELECT</text>
    <text x="548" y="352" class="ink cardtitle">A profile declares the wiring</text>

    <rect x="520" y="396" width="560" height="88" rx="14" fill="#F5F7FB" stroke="#DDE3ED" stroke-width="1.25"/>
    <text x="548" y="430" class="mono" font-size="16" fill="#3157D5">02 / COMPOSE</text>
    <text x="548" y="460" class="ink cardtitle">Merge once for this run</text>

    <rect x="520" y="504" width="560" height="88" rx="14" fill="#EDF9F5" stroke="#B9E5D7" stroke-width="1.25"/>
    <text x="548" y="538" class="mono" font-size="16" fill="#198865">03 / PROTECT</text>
    <text x="548" y="568" class="ink cardtitle">Redact output. Audit names.</text>

    <path d="M1120 356h76" stroke="#3157D5" stroke-width="2.25" marker-end="url(#arrow)"/>
    <text x="1160" y="326" text-anchor="middle" class="small" fill="#3157D5">run / fetch</text>
    <path d="M1120 592h76" stroke="#8A94A6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-muted)"/>
    <text x="1160" y="562" text-anchor="middle" class="small faint">names only</text>

    <rect x="1216" y="196" width="320" height="470" rx="22" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.25"/>
    <text x="1248" y="240" class="label faint">CONSUMERS</text>
    <text x="1248" y="276" class="ink cardtitle">Use, without exposure</text>

    <rect x="1240" y="302" width="272" height="108" rx="14" fill="#EEF2FF"/>
    <path d="M1264 326h26a5 5 0 0 1 5 5v20a5 5 0 0 1-5 5h-26a5 5 0 0 1-5-5v-20a5 5 0 0 1 5-5Z" fill="none" stroke="#3157D5" stroke-width="2"/><path d="m1267 337 5 4-5 4m9 0h8" fill="none" stroke="#3157D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1310" y="342" class="ink" font-size="21" font-weight="700">Agent runtime</text>
    <text x="1264" y="386" class="mono" font-size="15" fill="#3157D5">mxenv run --serve</text>

    <rect x="1240" y="430" width="272" height="86" rx="14" fill="#F5F7FB"/>
    <text x="1264" y="478" class="ink" font-size="21" font-weight="700">Your process</text>

    <rect x="1240" y="536" width="272" height="106" rx="14" fill="#F7F8FA" stroke="#C7CEDA" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1264" y="582" class="muted" font-size="21" font-weight="700">Model context</text>
    <text x="1264" y="614" class="small faint">inspect · skill · audit</text>
  </g>
</svg>
