<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Secrets for the process, not the prompt</title>
  <desc id="desc">run serve hands the child a loopback endpoint and random token; values are fetched one at a time; model context stays names-only.</desc>
  <defs><style>.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}.ink{fill:#111827}.muted{fill:#5B6472}.small{font-size:17px}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3157D5"/></marker></defs>
  <rect width="1600" height="700" fill="#F7F9FC"/>
  <g class="sans">
    <text x="64" y="64" fill="#3157D5" font-size="15" font-weight="700" letter-spacing="2">AGENT BOUNDARY</text>
    <text x="64" y="128" class="ink" font-size="52" font-weight="700" letter-spacing="-1.8">Secrets for the process.</text>
    <text x="64" y="188" fill="#3157D5" font-size="52" font-weight="700" letter-spacing="-1.8">Not the prompt.</text>

    <g>
      <rect x="64" y="242" width="650" height="86" rx="14" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.25"/>
      <circle cx="106" cy="285" r="19" fill="#E8EDFF"/><text x="106" y="292" text-anchor="middle" fill="#3157D5" font-size="18" font-weight="700">1</text>
      <text x="146" y="278" class="ink" font-size="22" font-weight="700">Compose, then serve on loopback</text>
      <text x="146" y="308" class="mono small" fill="#3157D5">mxenv run --serve -- &lt;command&gt;</text>

      <rect x="64" y="348" width="650" height="86" rx="14" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.25"/>
      <circle cx="106" cy="391" r="19" fill="#E8EDFF"/><text x="106" y="398" text-anchor="middle" fill="#3157D5" font-size="18" font-weight="700">2</text>
      <text x="146" y="400" class="ink" font-size="22" font-weight="700">Hand over capability, not the values</text>

      <rect x="64" y="454" width="650" height="86" rx="14" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.25"/>
      <circle cx="106" cy="497" r="19" fill="#E8EDFF"/><text x="106" y="504" text-anchor="middle" fill="#3157D5" font-size="18" font-weight="700">3</text>
      <text x="146" y="490" class="ink" font-size="22" font-weight="700">Fetch one key when it is needed</text>
      <text x="146" y="520" class="mono small" fill="#3157D5">mxenv fetch OPENAI_API_KEY</text>
    </g>

    <rect x="774" y="64" width="762" height="522" rx="24" fill="#111827"/>
    <text x="814" y="114" fill="#B8C1CF" font-size="15" font-weight="700" letter-spacing="2">INSIDE ONE RUN</text>
    <rect x="814" y="146" width="266" height="94" rx="14" fill="#1D293B" stroke="#3B4A61" stroke-width="1.25"/>
    <text x="840" y="202" fill="#FFFFFF" font-size="23" font-weight="700">Agent / CLI</text>
    <path d="M1080 193h96" stroke="#6685FF" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="1194" y="146" width="302" height="94" rx="14" fill="#1D293B" stroke="#3B4A61" stroke-width="1.25"/>
    <text x="1220" y="202" fill="#FFFFFF" font-size="23" font-weight="700">Child process</text>

    <rect x="1004" y="310" width="302" height="104" rx="16" fill="#253B64" stroke="#6685FF" stroke-width="1.5"/>
    <circle cx="1044" cy="346" r="11" fill="#79E2C3"/><circle cx="1044" cy="343.5" r="3" fill="#173F38"/><path d="m1042.6 346-1.7 5.5h6.2l-1.7-5.5Z" fill="#173F38"/>
    <text x="1068" y="352" fill="#FFFFFF" font-size="22" font-weight="700">Loopback server</text>
    <text x="1030" y="390" fill="#C9D6FF" font-size="17">GET /key/:name · Bearer token</text>
    <path d="M1345 240v30c0 16-13 23-29 23h-10" fill="none" stroke="#6685FF" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M1306 386h39v-112" fill="none" stroke="#79E2C3" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="1364" y="358" fill="#79E2C3" font-size="16">one value</text>
    <text x="1364" y="380" fill="#79E2C3" font-size="16">on demand</text>
    <path d="M947 240v230" fill="none" stroke="#8A94A6" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="902" y="336" text-anchor="end" fill="#B8C1CF" font-size="15">inspect / audit</text>
    <text x="902" y="357" text-anchor="end" fill="#B8C1CF" font-size="15">names only</text>

    <rect x="814" y="470" width="682" height="76" rx="14" fill="#182233" stroke="#3B4A61" stroke-width="1.25" stroke-dasharray="6 5"/>
    <text x="840" y="500" fill="#B8C1CF" font-size="16" font-weight="700">MODEL CONTEXT</text>
    <text x="840" y="527" fill="#FFFFFF" font-size="19">OPENAI_API_KEY · infisical · ready</text>
    <text x="1468" y="516" text-anchor="end" fill="#79E2C3" font-size="17">names, never values</text>

    <path d="M64 628h1472" stroke="#D7DDE8" stroke-width="1.25"/>
    <text x="1536" y="672" text-anchor="end" class="mono" font-size="17" fill="#3157D5">inspect · audit · skill = value-free</text>
  </g>
</svg>
